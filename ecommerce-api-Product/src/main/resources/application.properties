spring.application.name=product-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=products
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=products
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.default-schema=products
spring.flyway.schemas=products
